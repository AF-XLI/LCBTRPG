<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCBTRPG 戦闘システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="lobby" class="lobby" hidden>
    <h1 class="lobby-title">LCBTRPG 戦闘システム</h1>
    <p class="lobby-note">同じルームIDを入力した人同士で戦闘画面を共有します。</p>
    <label class="field">ルームID<input id="lobbyRoom" type="text" maxlength="40" placeholder="例: table1" autocomplete="off"></label>
    <label class="field">役割
      <select id="lobbyRole">
        <option value="gm">GM(進行・敵の行動決定・全操作)</option>
        <option value="player" selected>プレイヤー</option>
        <option value="observer">観戦</option>
      </select>
    </label>
    <button id="lobbyJoin" class="btn primary" type="button">入室</button>
    <p id="lobbyMode" class="lobby-note"></p>
  </div>
  <div id="main" hidden>
    <header id="head" class="head"></header>
    <div class="layout">
      <section class="stage-wrap">
        <div id="sideL" class="sidebar left" hidden></div>
        <div id="sideR" class="sidebar right" hidden></div>
        <div id="stage" class="stage"></div>
        <svg id="arrows" class="arrows" xmlns="http://www.w3.org/2000/svg"></svg>
      </section>
      <aside class="side">
        <div id="panel" class="panel"></div>
        <div id="plan" class="plan"></div>
        <div id="gmtools" class="panel"></div>
      </aside>
    </div>
  </div>
  <div id="logwin" class="logwin" hidden></div>
  <div id="dock" class="dock" hidden></div>
  <div id="popup" class="popup" hidden></div>
</div>
<script src="../config.js"></script>
<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
